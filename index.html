    <script>
      // This fallback also works when the application bundle cannot be downloaded.
      (function () {
        window.addEventListener(
          "error",
          function () {
            var message = document.getElementById("startup-message");
            if (message)
              message.textContent =
                "Le chargement a échoué. Rechargez la page. Si le problème persiste, vérifiez que GitHub Pages publie le dossier dist généré par le workflow, puis signalez l’erreur de la console.";
